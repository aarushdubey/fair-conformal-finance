[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fair-conformal-finance"
version = "0.1.0"
description = "Fair Conformal Classification for Financial Transactions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0,<2.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "ucimlrepo>=0.0.3",
    "openpyxl>=3.1.0",
    "click",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["ruff", "black"]

[project.scripts]
fairtranscp = "src.utils.evaluation:main" # Need to implement main in evaluation.py
