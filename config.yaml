# FairTransCP Global Configuration
# This file manages hyperparameters for all experiments to ensure reproducibility.

experiment:
  n_trials: 5
  test_size: 0.2
  cal_fraction: 0.3
  random_state: 42

conformal:
  alpha: 0.1
  score_fn: "aps" # Options: 'softmax', 'aps'
  fairness_weight: 0.4
  optimize_lambda: true
  beta: 0.1

datasets:
  german_credit:
    sensitive: "age"
  taiwan_credit:
    sensitive: "gender"
  adult_income:
    sensitive: "gender"

models:
  rf:
    n_estimators: 300
    max_depth: 10
  xgboost:
    learning_rate: 0.1
    max_depth: 6
  lightgbm:
    learning_rate: 0.1
    max_depth: 6
