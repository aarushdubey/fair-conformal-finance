services:
  - type: web
    name: fairtranscp-webapp
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r webapp/requirements.txt"
    startCommand: "streamlit run webapp/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

